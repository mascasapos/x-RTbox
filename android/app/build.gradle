plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xrtbox.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xrtbox.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // firmada con la clave de depuracion para poder instalarla directamente
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Los ejemplos de la carpeta ejemplos/ del repositorio van dentro de la app
def ejemplosGenerados = new File(buildDir, 'generated/ejemplos')
android.sourceSets.main.assets.srcDir(ejemplosGenerados)
tasks.register('copiarEjemplos', Copy) {
    from(new File(rootDir, '../ejemplos')) {
        include '*.cpp'
    }
    into new File(ejemplosGenerados, 'ejemplos')
}
preBuild.dependsOn('copiarEjemplos')
